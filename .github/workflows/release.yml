name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pinned toolchain
        run: rustup toolchain install
      - name: Required gate
        run: cargo xtask ci

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Pinned toolchain and target
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build the archive for the tag
        run: cargo xtask dist --target "$TARGET" --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write and verify checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --verify-tag --generate-notes
